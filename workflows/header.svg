<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b1145">
        <animate attributeName="stop-color" values="#1b1145;#0f3460;#3a1c71;#1b1145" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#ff7eb6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="900" height="260" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
  <rect width="900" height="260" fill="url(#bg)"/>
  <text x="40" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">&lt;?php
    <animate attributeName="y" values="270;-20" dur="6.0s" begin="-0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="6.0s" begin="-0.0s" repeatCount="indefinite"/>
  </text>
  <text x="112" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">SELECT *
    <animate attributeName="y" values="270;-20" dur="7.5s" begin="-0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="7.5s" begin="-0.9s" repeatCount="indefinite"/>
  </text>
  <text x="184" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">artisan
    <animate attributeName="y" values="270;-20" dur="9.0s" begin="-1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="9.0s" begin="-1.8s" repeatCount="indefinite"/>
  </text>
  <text x="256" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">{ }
    <animate attributeName="y" values="270;-20" dur="10.5s" begin="-2.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="10.5s" begin="-2.7s" repeatCount="indefinite"/>
  </text>
  <text x="328" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">=&gt;
    <animate attributeName="y" values="270;-20" dur="12.0s" begin="-3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="12.0s" begin="-3.6s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">Route::get
    <animate attributeName="y" values="270;-20" dur="6.0s" begin="-4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="6.0s" begin="-4.5s" repeatCount="indefinite"/>
  </text>
  <text x="472" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">$this
    <animate attributeName="y" values="270;-20" dur="7.5s" begin="-5.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="7.5s" begin="-5.4s" repeatCount="indefinite"/>
  </text>
  <text x="544" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">npm run dev
    <animate attributeName="y" values="270;-20" dur="9.0s" begin="-6.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="9.0s" begin="-6.3s" repeatCount="indefinite"/>
  </text>
  <text x="616" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">git push
    <animate attributeName="y" values="270;-20" dur="10.5s" begin="-7.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="10.5s" begin="-7.2s" repeatCount="indefinite"/>
  </text>
  <text x="688" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">migrate
    <animate attributeName="y" values="270;-20" dur="12.0s" begin="-8.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="12.0s" begin="-8.1s" repeatCount="indefinite"/>
  </text>
  <text x="760" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">&lt;div&gt;
    <animate attributeName="y" values="270;-20" dur="6.0s" begin="-9.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="6.0s" begin="-9.0s" repeatCount="indefinite"/>
  </text>
  <text x="832" y="260" font-family="Courier New, monospace" font-size="14" fill="#58a6ff" opacity="0">return
    <animate attributeName="y" values="270;-20" dur="7.5s" begin="-9.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="7.5s" begin="-9.9s" repeatCount="indefinite"/>
  </text>
  <path d="M0 215 Q 112.5 177 225 215 T 450 215 T 675 215 T 900 215 T 1125 215 T 1350 215 T 1575 215 T 1800 215 V 400 H 0 Z" fill="#bc8cff" opacity="0.18">
    <animateTransform attributeName="transform" type="translate" from="-450 0" to="0 0" dur="11s" repeatCount="indefinite"/>
  </path>
  <path d="M0 228 Q 112.5 190 225 228 T 450 228 T 675 228 T 900 228 T 1125 228 T 1350 228 T 1575 228 T 1800 228 V 400 H 0 Z" fill="#58a6ff" opacity="0.25">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M0 240 Q 112.5 202 225 240 T 450 240 T 675 240 T 900 240 T 1125 240 T 1350 240 T 1575 240 T 1800 240 V 400 H 0 Z" fill="#4f7cff" opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-450 0" dur="5.5s" repeatCount="indefinite"/>
  </path>
  <text x="450" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="url(#txt)" filter="url(#glow)" opacity="0">Gizedin Al Qorni Gunawan
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="450" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#c9d1d9" letter-spacing="2">Backend Developer  /  Founder of MZ DevWorks
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
  </text>
  </g>
</svg>
