<svg xmlns="http://www.w3.org/2000/svg" width="900" height="14" viewBox="0 0 900 14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.33" stop-color="#bc8cff"/>
      <stop offset="0.66" stop-color="#ff7eb6"/>
      <stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="5" width="900" height="4" rx="2" fill="url(#g)"/>
  <circle cy="7" r="5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="0;900;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
